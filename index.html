<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>De Analist</title>
  <style>
    :root {
      --bg: #0d0e12;
      --bg-card: #151821;
      --border: #222634;
      --ink: #f1f5f9;
      --ink-muted: #94a3b8;
      --ink-faint: #64748b;
      --accent: #c8311a;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    @keyframes daspin {
      to { transform: rotate(360deg); }
    }

    .da-tabpanel { display: block; }

    /* ── STRATEGIE TAB — nieuwe stijl ── */
    .st-main {
        max-width: 860px; margin: 0 auto;
        padding: 0 20px calc(var(--safe-bottom) + 80px);
    }
    .st-brand-label {
        font-size: 10px; font-weight: 700; color: var(--accent);
        letter-spacing: .15em; text-transform: uppercase; margin-bottom: 4px;
    }
    .st-page-title {
        font-family: var(--font-serif); font-size: 26px; font-weight: 700;
        color: var(--ink); line-height: 1.2; margin-bottom: 4px;
    }
    .st-page-sub {
        font-size: 12px; color: var(--ink-muted); margin-bottom: 16px;
    }

    /* Tickers grid */
    .st-tickers {
        display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 16px;
    }
    .st-tick {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 8px; padding: 7px 6px; text-align: center;
    }
    .st-tick-name { font-size: 9px; color: var(--ink-faint); font-weight: 700; display: block; text-transform: uppercase; letter-spacing: .5px; }
    .st-tick-val  { font-size: 12px; font-weight: 700; color: var(--ink); display: block; margin: 2px 0; }
    .st-tick-chg  { font-size: 9px; font-weight: 600; }
    .st-tick-up   { color: #48bb78; }
    .st-tick-dn   { color: #f87171; }

    /* Regime */
    .st-regime-block {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 12px; padding: 14px; margin-bottom: 16px;
    }
    .st-regime-top {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .st-regime-lbl {
        font-size: 10px; font-weight: 700; color: var(--ink-muted);
        letter-spacing: .1em; text-transform: uppercase;
    }
    .st-regime-pill {
        font-size: 9px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
    }
    .pill-offensief { background: rgba(16,185,129,.1); border: 1px solid rgba(52,211,153,.3); color: #34d399; }
    .pill-neutraal  { background: rgba(245,158,11,.1);  border: 1px solid rgba(251,191,36,.3);  color: #fbbf24; }
    .pill-defensief { background: rgba(239,68,68,.1);   border: 1px solid rgba(248,113,113,.3); color: #f87171; }

    .st-bar-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 8px; font-size: 11px;
    }
    .st-bar-row:last-child { margin-bottom: 0; }
    .st-bar-name { width: 38%; color: var(--ink-muted); }
    .st-bar-track { flex: 1; background: #2d3748; height: 5px; border-radius: 99px; overflow: hidden; margin: 0 8px; }
    .st-bar-fill  { height: 100%; border-radius: 99px; transition: width .6s ease; }
    .st-bar-val   { width: 24px; text-align: right; font-family: monospace; color: #a0aec0; font-size: 11px; }

    /* Section label */
    .st-section-label {
        font-size: 10px; font-weight: 700; color: var(--ink-muted);
        letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; margin-top: 20px;
    }

    /* Filter row */
    .st-filter-row {
        display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px;
        scrollbar-width: none;
    }
    .st-filter-row::-webkit-scrollbar { display: none; }
    .st-fbtn {
        font-family: var(--font-sans); font-size: 11px; font-weight: 500;
        padding: 5px 12px; border-radius: 7px;
        border: 1px solid var(--border); background: var(--bg-card);
        color: var(--ink-muted); cursor: pointer; white-space: nowrap;
        transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .st-fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Report cards */
    .st-cards { display: flex; flex-direction: column; gap: 8px; }
    .st-rcard {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 12px; overflow: hidden;
    }
    .st-rcard-header {
        width: 100%; padding: 14px; text-align: left; background: none;
        border: none; cursor: pointer;
        display: flex; justify-content: space-between; align-items: flex-start;
        -webkit-tap-highlight-color: transparent;
    }
    .st-rcard-left { flex: 1; padding-right: 8px; }
    .st-rcard-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .st-rbadge {
        font-size: 9px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .06em; padding: 2px 7px; border-radius: 4px;
    }
    .badge-daily  { background: rgba(59,130,246,.15);  color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
    .badge-weekly { background: rgba(167,139,250,.15); color: #a78bfa; border: 1px solid rgba(167,139,250,.25); }
    .badge-deep   { background: rgba(14,165,233,.15);  color: #38bdf8; border: 1px solid rgba(14,165,233,.25); }
    .st-rcard-date  { font-size: 10px; color: var(--ink-faint); }
    .st-rcard-title {
        font-family: var(--font-serif); font-size: 14px; font-weight: 700;
        color: var(--ink); line-height: 1.35; margin-bottom: 4px;
    }
    .st-rcard-desc {
        font-size: 11px; color: var(--ink-muted); line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .st-chevron {
        flex-shrink: 0; margin-top: 2px; color: var(--ink-faint);
        transition: transform .2s; width: 20px; height: 20px;
    }
    .st-chevron.open { transform: rotate(180deg); }
    .st-rcard-body {
        display: none; padding: 0 14px 14px;
        border-top: 1px solid var(--border);
    }
    .st-rcard-body.open { display: block; padding-top: 12px; }

    /* Prognose highlight */
    .st-prognose {
        border-left: 2px solid #f6ad55; padding: 6px 10px;
        background: rgba(246,173,85,.05); border-radius: 0 6px 6px 0; margin-bottom: 10px;
    }
    .st-prognose-lbl { font-size: 10px; font-weight: 700; color: #f6ad55; margin-bottom: 3px; }
    .st-prognose-txt { font-size: 11px; color: #cbd5e0; line-height: 1.5; }

    /* Body tekst */
    .st-body-txt { font-size: 11px; color: var(--ink-muted); line-height: 1.6; margin-bottom: 10px; }

    /* Weekly 3-grid */
    .st-grid3 { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .st-g3card {
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 10px; font-size: 11px;
    }
    .st-g3-lbl { font-weight: 700; display: block; margin-bottom: 3px; }
    .st-g3-txt { color: var(--ink-muted); line-height: 1.4; }

    /* Download knop */
    .st-dl-btn {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        width: 100%; padding: 9px; background: var(--accent); border: none;
        border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700;
        cursor: pointer; margin-top: 4px; font-family: var(--font-sans);
        transition: opacity .15s; -webkit-tap-highlight-color: transparent;
    }
    .st-dl-btn:hover { opacity: .88; }

    /* Loader */
    .st-loader { text-align: center; padding: 48px 0; display: none; }
    .st-error  {
        display: none; background: #1f0a0a; border: 1px solid #3a1a1a;
        border-radius: 12px; padding: 16px; font-size: 13px;
        color: #f87171; text-align: center; margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div id="tab-strategie" class="da-tabpanel">
  <div class="st-main" style="padding-top:20px;">

    <!-- BRAND + TITEL -->
    <div class="st-brand-label">DeAnalist — Strategy</div>
    <div class="st-page-title">Wat mist de markt vandaag?</div>
    <div class="st-page-sub">Gelaagde analyse — macro, positionering en fundamentals in één conclusie.</div>

    <!-- LOADER -->
    <div class="st-loader" id="st-loader">
      <div style="width:32px;height:32px;border:2px solid #333;border-top-color:#C8311A;border-radius:50%;animation:daspin .8s linear infinite;margin:0 auto 14px;"></div>
      <p style="font-size:13px;color:#888;">Marktdata ophalen &amp; strategie analyseren…</p>
    </div>

    <!-- FOUT -->
    <div class="st-error" id="st-error"></div>

    <!-- TICKERS (dynamisch) -->
    <div class="st-tickers" id="st-tickers" style="display:none;">
      <!-- 6 tickers dynamisch -->
    </div>

    <!-- MARKTREGIME (dynamisch) -->
    <div class="st-regime-block" id="st-regime-block" style="display:none;">
      <div class="st-regime-top">
        <span class="st-regime-lbl">Marktregime</span>
        <span class="st-regime-pill" id="st-regime-pill">● —</span>
      </div>
      <div id="st-bars"><!-- dynamisch gevuld --></div>
    </div>

    <!-- RAPPORTAGES -->
    <div id="st-rapporten-section" style="display:none;">
      <div class="st-section-label">Rapportages</div>
      <div class="st-filter-row">
        <button class="st-fbtn active" onclick="stFilter('all',this)">Alle</button>
        <button class="st-fbtn" onclick="stFilter('daily',this)">Daily Strategy Notes</button>
        <button class="st-fbtn" onclick="stFilter('weekly',this)">Weekly Positioning</button>
        <button class="st-fbtn" onclick="stFilter('deep',this)">Deep-Dive</button>
      </div>
      <div class="st-cards" id="st-cards"><!-- dynamisch gevuld --></div>
    </div>

  </div>
</div><!-- /tab-strategie -->

</body>
</html>
